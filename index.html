<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7ec">
  <title>LabelLearn</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LabelLearn">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="supermarket.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="logo"><img src="icon.svg" alt="" width="30" height="30"><span class="lw">Label<em>Learn</em></span></div>
      <div class="seg" role="group" aria-label="Idioma de traducción">
        <button data-lang="es" aria-pressed="true">ES</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
    </header>

    <div class="subbar">
      <button class="back" id="back" hidden>‹ <span id="backTxt">Casa</span></button>
      <div class="room-title" id="roomTitle" aria-live="polite"></div>
      <button class="room-save" id="roomSave" hidden></button>
    </div>

    <main class="view" id="view"></main>

    <div class="toggles">
      <button class="chip" id="togPinyin" aria-pressed="true">拼 Pinyin</button>
      <button class="chip" id="togTrans" aria-pressed="true">译 Traducción</button>
    </div>

    <div class="sheet" id="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="shZh">
        <button class="sheet-close" id="shClose" aria-label="Cerrar">×</button>
        <div class="sh-emoji" id="shEmoji"></div>
        <div class="sh-zh" id="shZh"></div>
        <div class="sh-py" id="shPy"></div>
        <div class="sh-tr" id="shTr"></div>
        <div class="sh-actions">
          <button class="play" id="shPlay">🔊 Escuchar</button>
          <button class="play star" id="shStar" aria-pressed="false">☆ Guardar</button>
        </div>
        <a class="city-house-link" id="shSupermarket" href="#/supermarket" hidden>Entrar al supermercado →</a>
        <a class="city-house-link" id="shHouse" href="#/" hidden>Entrar a la casa de LabelLearn →</a>
      </div>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="search-index.js"></script>
  <script src="sentences.js"></script>
  <script src="flashcards.js"></script>
  <script src="search.js"></script>
  <script src="iso.js"></script>
  <script src="scene-bathroom.js"></script>
  <script src="scene-kids.js"></script>
  <script src="scene-kitchen.js"></script>
  <script src="scene-dining.js"></script>
  <script src="scene-laundry.js"></script>
  <script src="scene-living.js"></script>
  <script src="scene-study.js"></script>
  <script src="scene-garden.js"></script>
  <script src="scene-bedroom.js"></script>
  <script src="scene-entrance.js"></script>
  <script src="scene-structure.js"></script>
  <script src="scene-misc.js"></script>
  <script src="scene-positions.js"></script>
  <script src="iso-view.js"></script>
  <script src="city-vocab.js"></script>
  <script src="city-map.js"></script>
  <script src="city-geometry.js"></script>
  <script src="city-scene.js"></script>
  <script src="city-view.js"></script>
  <script src="supermarket-vocab.js"></script>
  <script src="supermarket-products.js"></script>
  <script src="supermarket-layout.js"></script>
  <script src="supermarket-geometry.js"></script>
  <script src="supermarket-fresh-geometry.js"></script>
  <script src="supermarket-fresh-scene.js"></script>
  <script src="supermarket-scene.js"></script>
  <script src="supermarket-view.js"></script>
  <script src="app.js"></script>
</body>
</html>
